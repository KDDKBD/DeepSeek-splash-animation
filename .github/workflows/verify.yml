name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # None of these need a running DSH. `tools/verify-http.mjs` drives a live
      # server and stays a manual step.
      - name: Host logic (config coercion, media resolution, the engage gate, picker encoding)
        run: node tools/verify-host.mjs
      - name: Routes (all four routes, driven in-process)
        run: node tools/verify-routes.mjs
      - name: Contract (manifest, Host exports, browser registration, cross-half config)
        run: node tools/verify-contract.mjs

      # Network access is needed to ask the registry whether the package exists;
      # a 404 is the expected answer until it is published.
      - name: Install docs (README advertises only install routes that work)
        run: node tools/verify-install-docs.mjs

      # --allow-placeholders is for CI only: it skips the repository-URL check so a
      # fork without its URLs filled in still validates its packaging. Drop the flag
      # locally before publishing.
      - name: Package contents (runtime and listing files survive npm publish)
        run: node tools/verify-package-contents.mjs
